
services:
  postgres:
    image: postgres:16-alpine
    container_name: atos_postgres
    restart: always
    environment:
      POSTGRES_USER: atos_user
      POSTGRES_PASSWORD: atos_password
      POSTGRES_DB: atos_support_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    container_name: atos_n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
    volumes:
      - n8n_data:/root/.n8n

volumes:
  postgres_data:
  n8n_data: